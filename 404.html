<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | Pablo Augusto Juan</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  h1 { font-family: "Geist", system-ui, sans-serif; font-weight: 700; font-size: clamp(140px, 34vw, 480px); line-height: 1; letter-spacing: -0.05em; margin: 0; user-select: none; }
</style>
</head>
<body>
<h1>404</h1>
<script>
(() => {
  // Transição entre páginas: o botão e os elementos são sugados em sequência, diminuindo e distorcendo até sumir
  const KEY = "alien-bh-transition";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pct = () => (window.innerWidth < 640 ? 0.76 : 0.66);
  const hero = () => document.querySelector(".hero");

  function makeBlack() {
    const o = document.createElement("div");
    o.setAttribute("aria-hidden", "true");
    o.style.cssText = "position:fixed;inset:0;z-index:99999;background:#000;opacity:0;pointer-events:none;";
    document.documentElement.appendChild(o);
    return o;
  }

  // todos percorrem a mesma espiral em volta da massa; o movimento é suave (muitos quadros, ângulo sem saltos)
  function swallow(el, c, delay, dur) {
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const base = getComputedStyle(el).transform;          // preserva o posicionamento original (ex.: botão centralizado)
    const baseT = base === "none" ? "" : base + " ";
    const H = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    const a0 = Math.atan2(H.y - c.y, H.x - c.x);
    const d0 = Math.hypot(H.x - c.x, H.y - c.y) || 1;
    const SWEEP = Math.PI;                                // meio giro em volta da massa, igual para todos                          // curva circular em volta da massa, igual para todos
    const pos = (u) => {
      const t = Math.pow(u, 1.6);                         // acelera conforme se aproxima
      const rad = d0 * Math.pow(1 - t, 1.3);
      const ang = a0 + SWEEP * t;
      return { x: c.x + rad * Math.cos(ang), y: c.y + rad * Math.sin(ang), t, ang };
    };
    const N = 60;
    const frames = [];
    let prevTheta = null;
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const p = pos(u);
      const q = pos(Math.min(1, u + 0.005));
      const pb = pos(Math.max(0, u - 0.005));
      let theta = (Math.atan2(q.y - pb.y, q.x - pb.x) * 180) / Math.PI;
      if (prevTheta !== null) {                           // desdobra o ângulo: nunca gira pelo caminho errado
        while (theta - prevTheta > 180) theta -= 360;
        while (theta - prevTheta < -180) theta += 360;
      }
      prevTheta = theta;
      const t = p.t;
      const stretch = 1 + 1.8 * Math.pow(t, 1.3);         // estica, mas as frases não ficam longas demais
      const squeeze = 1 - 0.75 * t;                       // afina forte nas laterais
      const size = Math.max(0.02, 1 - t);                 // diminui continuamente até sumir
      frames.push({
        transform: `${baseT}translate(${(p.x - H.x).toFixed(2)}px, ${(p.y - H.y).toFixed(2)}px) rotate(${theta.toFixed(2)}deg) ` +
                   `scale(${(stretch * size).toFixed(4)}, ${(Math.max(0.05, squeeze) * size).toFixed(4)}) rotate(${(-theta).toFixed(2)}deg)`,
        filter: `blur(${(18 * Math.pow(t, 1.2)).toFixed(1)}px) drop-shadow(0 0 ${(8 + 26 * t).toFixed(1)}px rgba(255,241,204,${(0.4 + 0.5 * t).toFixed(2)}))`,
        opacity: t < 0.85 ? "1" : (1 - (t - 0.85) / 0.15).toFixed(3),
        offset: u,
      });
    }
    frames[0].transform = base === "none" ? "none" : base;
    frames[0].filter = "none";
    frames[0].opacity = "1";
    el.animate(frames, { duration: dur, delay, easing: "linear", fill: "forwards" });
  }

  function runOut(href) {
    const h = hero();
    const c = { x: window.innerWidth / 2, y: window.innerHeight * pct() };
    const black = makeBlack();

    if (h) {
      h.style.transformOrigin = `50% ${pct() * 100}%`;
      h.animate(
        [{ transform: "scale(1)" }, { transform: "scale(2.6)", offset: 0.5 }, { transform: "scale(14)" }],
        { duration: 1350, easing: "cubic-bezier(.6,0,1,.6)", fill: "forwards" }
      );
    }

    // ordem: botão primeiro, depois eyebrow, título, subtítulo, logo e menu
    const seq = [
      document.querySelector(".bw-cta"),
      ...document.querySelectorAll(".bw-eyebrow .bh-word"),
      ...document.querySelectorAll(".bw-title .bh-word"),
      ...document.querySelectorAll(".bw-sub .bh-word"),
    ].filter(Boolean);
    const step = 16;
    seq.forEach((el, i) => swallow(el, c, 20 + i * step, 900));

    black.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 1150, easing: "ease-in", fill: "forwards" });

    setTimeout(() => {
      try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
      location.href = href;
    }, 1700);
  }

  function runIn() {
    const h = hero();
    const black = makeBlack();
    black.style.opacity = "1";
    black.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, delay: 120, easing: "ease-out", fill: "forwards" }).onfinish = () => black.remove();
    if (h) {
      h.style.transformOrigin = `50% ${pct() * 100}%`;
      h.animate([{ transform: "scale(6)" }, { transform: "scale(1)" }], { duration: 1000, easing: "cubic-bezier(.1,.7,.2,1)", fill: "backwards" });
    }
  }

  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href]");
    if (!a || reduce) return;
    const href = a.getAttribute("href");
    if (!/\.html$/.test(href) || a.target === "_blank") return;
    e.preventDefault();
    runOut(href);
  });

  let arriving = false;
  try { arriving = sessionStorage.getItem(KEY) === "1"; sessionStorage.removeItem(KEY); } catch (e) {}
  if (arriving && !reduce) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", runIn);
    else runIn();
  }
})();
</script>
</body>
</html>
