<h1>Let’s talk about your project</h1>
<p class="upd">I reply within 1 business day. If you prefer, message me on <a href="https://wa.me/5516993370772" target="_blank" rel="noopener">WhatsApp</a>.</p>
<form id="cf" novalidate>
  <div class="two">
    <label class="f">Name*<input name="nome" autocomplete="name" required></label>
    <label class="f">Email*<input name="email" type="email" autocomplete="email" required></label>
  </div>
  <div class="two">
    <label class="f">WhatsApp / phone<input name="whatsapp" type="tel" autocomplete="tel"></label>
    <label class="f">Company or brand<input name="empresa" autocomplete="organization"></label>
  </div>
  <div class="two">
    <label class="f">What do you need?<select name="servico"><option>Ad creatives</option><option>Video / motion</option><option>Landing page or website</option><option>Visual identity</option><option>Other</option></select></label>
    <label class="f">Budget<select name="orcamento"><option>Not sure yet</option><option>Up to US$ 500</option><option>US$ 500 – 1,500</option><option>US$ 1,500 – 5,000</option><option>Over US$ 5,000</option></select></label>
  </div>
  <label class="f">Message*<textarea name="mensagem" required placeholder="Goal, deadline, reference links…"></textarea></label>
  <input class="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label class="ok"><input type="checkbox" name="aceite" required><span>I agree to the use of my data to reply to this message, as described in the <a href="politica-de-privacidade.en.html">Privacy policy</a>.*</span></label>
  <button class="send" type="submit">Send message</button>
  <p class="msg" role="status" aria-live="polite"></p>
</form>
