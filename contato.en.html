  form { margin-top: 32px; display: grid; gap: 16px; }

  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232, 80, 2, .25); }

  .send:hover { background: #ff6a1f; }
  .send:disabled { opacity: .6; cursor: wait; }
  .msg { font-size: 14px; } .msg.err { color: #ff8a8c; } .msg.good { color: #8ef092; }
  .hp { position: absolute; left: -9999px; }
  @media (max-width: 640px) { .two { grid-template-columns: 1fr; } .top { height: 64px; } .logo { height: 22px; } }

<main>
<h1>Let’s talk about your project</h1>
<p class="upd">I reply within 1 business day. If you prefer, message me on <a href="https://wa.me/5516993370772" target="_blank" rel="noopener">WhatsApp</a>.</p>
<form id="cf" novalidate>
  <div class="two">
    <label class="f">Name*<input name="nome" autocomplete="name" required></label>
    <label class="f">Email*<input name="email" type="email" autocomplete="email" required></label>
  </div>
  <div class="two">
    <label class="f">WhatsApp / phone<input name="whatsapp" type="tel" autocomplete="tel"></label>
    <label class="f">Company or brand<input name="empresa" autocomplete="organization"></label>
  </div>
  <div class="two">
    <label class="f">What do you need?<select name="servico"><option>Ad creatives</option><option>Video / motion</option><option>Landing page or website</option><option>Visual identity</option><option>Other</option></select></label>
    <label class="f">Budget<select name="orcamento"><option>Not sure yet</option><option>Up to US$ 500</option><option>US$ 500 – 1,500</option><option>US$ 1,500 – 5,000</option><option>Over US$ 5,000</option></select></label>
  </div>
  <label class="f">Message*<textarea name="mensagem" required placeholder="Goal, deadline, reference links…"></textarea></label>
  <input class="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label class="ok"><input type="checkbox" name="aceite" required><span>I agree to the use of my data to reply to this message, as described in the <a href="politica-de-privacidade.en.html">Privacy policy</a>.*</span></label>
  <button class="send" type="submit">Send message</button>
  <p class="msg" role="status" aria-live="polite"></p>
</form>
</main>
<footer><a href="politica-de-privacidade.en.html">Privacy policy</a><a href="termos-de-uso.en.html">Terms of use</a><a href="#" data-cookie-prefs>Cookies</a><a href="contato.en.html">Contact form</a><span>© 2026 Pablo Augusto Juan · Alien</span></footer>
<script>
(() => {
  // Formulário: envia para FORM_ENDPOINT (site/config.js). Sem endereço configurado, abre o WhatsApp com a mensagem pronta.
  const f = document.getElementById("cf"), out = f.querySelector(".msg"), btn = f.querySelector(".send");
  const CFG = window.ALIEN_CONFIG || {};
  const L = {"req": "Please fill in the required fields (*) and accept the policy.", "sending": "Sending…", "ok": "Message sent! I’ll get back to you soon.", "fail": "Couldn’t send right now. Opening WhatsApp…", "hi": "Hi Pablo! I came from the website form.", "f": ["Name", "Email", "WhatsApp", "Company", "Service", "Budget", "Message"]};
  const say = (t, cls) => { out.textContent = t; out.className = "msg " + (cls || ""); };
  const toWhats = (d) => {
    const lines = [L.hi, "", L.f[0] + ": " + d.nome, L.f[1] + ": " + d.email, d.whatsapp && L.f[2] + ": " + d.whatsapp, d.empresa && L.f[3] + ": " + d.empresa, L.f[4] + ": " + d.servico, L.f[5] + ": " + d.orcamento, "", d.mensagem].filter((x) => x !== undefined && x !== "");
    window.open("https://wa.me/" + (CFG.WHATSAPP || "5516993370772") + "?text=" + encodeURIComponent(lines.join("\n")), "_blank", "noopener");
  };
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    if (d.site) return;                                   // robô
    if (!d.nome || !d.email || !/.+@.+\..+/.test(d.email) || !d.mensagem || !f.aceite.checked) return say(L.req, "err");
    window.alienTrack && window.alienTrack("generate_lead", { form: "contato", servico: d.servico });
    if (!CFG.FORM_ENDPOINT) { toWhats(d); return say(L.ok, "good"); }
    btn.disabled = true; say(L.sending);
    try {
      const r = await fetch(CFG.FORM_ENDPOINT, { method: "POST", headers: { "Accept": "application/json", "Content-Type": "application/json" }, body: JSON.stringify({ ...d, pagina: location.href, idioma: document.documentElement.lang }) });
      if (!r.ok) throw new Error(r.status);
      f.reset(); say(L.ok, "good");
    } catch (err) { say(L.fail, "err"); toWhats(d); }
    finally { btn.disabled = false; }
  });
})();
</script>
